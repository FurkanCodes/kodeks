[workspace]
members = ["src-tauri", "crates/kodeks-core", "crates/kodeks-protocol"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Veli Furkan TURKOGLU"]

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "process", "rt-multi-thread", "sync", "io-util", "time"] }
